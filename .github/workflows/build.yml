name: Build Safari Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: SafariChromium/SafariChromium
        run: npm install

      - name: Build portable Safari
        working-directory: SafariChromium/SafariChromium
        run: npx electron-builder --win portable --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Safari-Portable-Windows
          path: SafariChromium/SafariChromium/dist/*.exe
          if-no-files-found: error
