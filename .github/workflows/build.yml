name: Build Safari Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: SafariChromium/SafariChromium

      - name: Generate Windows icon
        run: npm run build:icon
        working-directory: SafariChromium/SafariChromium

      - name: Build installer and portable Safari
        run: npm run build -- --publish never
        working-directory: SafariChromium/SafariChromium
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $lines = Get-ChildItem "SafariChromium/SafariChromium/dist/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "SafariChromium/SafariChromium/dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Safari-Windows-Packages
          path: |
            SafariChromium/SafariChromium/dist/*.exe
            SafariChromium/SafariChromium/dist/SHA256SUMS.txt
          if-no-files-found: error
